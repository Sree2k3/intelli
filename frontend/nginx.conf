server {

    listen 80;

    server_name _;
 
    root /usr/share/nginx/html;

    index index.html;
 
    include /etc/nginx/mime.types;
 
    types {

        application/javascript mjs;

    }
 
    gzip on;

    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
 
    client_max_body_size 150M;
 
    location / {

        try_files $uri $uri/ /index.html;

    }
 
    # Proxy API and backend WebSocket requests to backend

    location /api/ {

        set $cors_origin "";

        if ($http_origin ~* "^https?://([a-zA-Z0-9-.]+\.)?scaloz\.com$") {
            set $cors_origin $http_origin;
        }

        if ($http_origin ~* "^https?://localhost(:\d+)?$") {
            set $cors_origin $http_origin;
        }

        if ($http_origin ~* "^https?://[a-zA-Z0-9-.]+\.localhost(:\d+)?$") {
            set $cors_origin $http_origin;
        }

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since,X-Tenant-ID' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }

        proxy_pass http://backend:8000/api/;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
 
        # Increase timeouts for long AI requests and video uploads

        proxy_read_timeout 600s;

        proxy_send_timeout 600s;

    }
 
    # Proxy WebSocket voice requests to voice-server

    location /voice {

        proxy_pass http://voice-server:8081;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open for continuous audio streams

        proxy_read_timeout 3600s;

        proxy_send_timeout 3600s;

    }

}

 