stages:

  - deploy

deploy:

  stage: deploy

  tags:

    - docker

  script:
    - cd /home/ubuntu/aiinterview_test
    - sudo git config --global --add safe.directory /home/ubuntu/aiinterview_test
    - sudo cp backend/.env backend/.env.prod.backup || true
    - sudo git stash || true
    - sudo git pull origin main
    - sudo cp backend/.env.prod.backup backend/.env || true
    - sudo cp -n backend/.env.example backend/.env || true

    - sudo cp -n frontend/.env.example frontend/.env || true

    - sudo cp -n voice-server/.env.example voice-server/.env || true

    - sudo docker compose down

    - sudo docker system prune -a -f

    - sudo docker system prune -f --volumes

    - sudo docker compose up -d --build

  only:

    - main    
 